name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # The repo scores its own changes with its own tool.
      - run: node packages/tier/dist/cli.js diff --base origin/main
        if: github.event_name == 'pull_request'
